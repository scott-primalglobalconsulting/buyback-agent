name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # npm install (not npm ci): some transitive wasm-binding optional deps
      # (@emnapi via @rolldown/@unrs/sharp) drift by patch version across
      # platforms, so a macOS-generated lockfile fails strict `npm ci` on the
      # Linux runner. `npm install` re-resolves the in-range optional deps here.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Reads the shipped tokens out of app/globals.css: contrast floors,
      # quadrant separation under simulated colour vision deficiency, and that
      # the four theme blocks agree. Cheap, and it catches the class of bug you
      # cannot see by looking at your own screen.
      - run: npm run validate:palette
